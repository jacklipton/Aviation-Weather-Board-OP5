version: "3.9"

services:
  dev:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    container_name: orange-pi-dev
    privileged: true
    volumes:
      - ../src:/workspace/src
      - ../.env:/workspace/.env
    env_file:
      - ../.env
    ports:
      - "8080:8080"
    working_dir: /workspace
    tty: true
