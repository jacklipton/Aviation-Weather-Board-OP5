version: "3.9"

services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: orange-pi-dev
    privileged: true
    devices:
      - "/dev/gpiomem:/dev/gpiomem"
      - "/dev/i2c-0:/dev/i2c-0"
      - "/dev/spidev0.0:/dev/spidev0.0"
    volumes:
      - ../src:/workspace/src
      - ../.env:/workspace/.env
    env_file:
      - ../.env
    ports:
      - "8080:8080"
    working_dir: /workspace
    platform: linux/arm64
    tty: true
