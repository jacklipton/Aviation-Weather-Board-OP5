services:
  app:
    image: ${DOCKERHUB_USERNAME}/${DOCKER_IMAGE_NAME}:latest
    container_name: avwx
    restart: unless-stopped
    network_mode: bridge
    # Tailscale's MagicDNS (100.100.100.100) is unreachable from Docker's
    # bridge network, so use public resolvers explicitly
    dns:
      - 1.1.1.1
      - 8.8.4.4
    ports:
      - "8080:8080"
    env_file:
      - .env
    devices:
      - "/dev/spidev4.1:/dev/spidev4.1"
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  watchtower:
    image: containrrr/watchtower
    container_name: watchtower
    restart: unless-stopped
    network_mode: bridge
    environment:
      - DOCKER_API_VERSION=1.44
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    # Check for new images every 300 seconds (5 minutes)
    command: --interval 300 --cleanup